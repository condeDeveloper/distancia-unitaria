[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distancia-unitaria"
version = "1.0.0"
description = "Grafos de distancia na grade inteira: numero cromatico exato por varredura, com clique e coloracao gulosa cercando o valor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "condeDeveloper" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
distancia_unitaria = "distancia_unitaria.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["distancia_unitaria*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-q"
